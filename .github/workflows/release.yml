name: Publish npm release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to publish (for example 0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: npm ci
      - run: npm ci --prefix docs
      - run: npm run release:check
      - run: npm run format:check
      - run: npm run check:ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:legacy
        env:
          GRID_BROWSER_ARTIFACTS: ${{ runner.temp }}/the-grid-browser-review
      - run: npm run preview --prefix docs -- --background
      - run: npm run docs:browser:all
        env:
          GRID_BROWSER_ARTIFACTS: ${{ runner.temp }}/the-grid-browser-review
      - name: Stop docs preview
        if: always()
        working-directory: docs
        run: npm exec -- astro preview stop
      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance --ignore-scripts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser-review
          path: ${{ runner.temp }}/the-grid-browser-review
          if-no-files-found: ignore
          retention-days: 7
