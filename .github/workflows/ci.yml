name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: npm ci
      - run: npm ci --prefix docs
      - run: npm run format:check
      - run: npm run check:ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run preview --prefix docs -- --background
      - run: npm run docs:browser:all
        env:
          GRID_BROWSER_ARTIFACTS: ${{ runner.temp }}/the-grid-browser-review
      - name: Stop docs preview
        if: always()
        working-directory: docs
        run: npm exec -- astro preview stop
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-review
          path: ${{ runner.temp }}/the-grid-browser-review
          if-no-files-found: ignore
          retention-days: 7
